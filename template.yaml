AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Property alert scraper for Bristol rentals

Parameters:
  RecipientEmail:
    Type: String
  SenderEmail:
    Type: String
  GmailPasswordParam:
    Type: String
    Default: /house-me/gmail-app-password
    Description: >-
      SSM Parameter Store path holding the Gmail app password as a SecureString.
      Only the path travels through CloudFormation; the function fetches and
      decrypts the value at runtime.
  EnabledScrapers:
    Type: String
    Default: rightmove
    Description: Comma-separated list of scrapers to run. OpenRent is disabled by default because it blocks AWS IP ranges.

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        DEDUP_BUCKET: !Ref DedupBucket
        RECIPIENT_EMAIL: !Ref RecipientEmail
        SENDER_EMAIL: !Ref SenderEmail
        GMAIL_PASSWORD_PARAM: !Ref GmailPasswordParam
        ENABLED_SCRAPERS: !Ref EnabledScrapers

Resources:
  DedupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "house-me-dedup-${AWS::Region}-${AWS::AccountId}"

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DedupBucket
        # SSMParameterReadPolicy wants the name without its leading slash.
        - SSMParameterReadPolicy:
            ParameterName: house-me/gmail-app-password
        # The AWS-managed aws/ssm key delegates authorisation to IAM, so
        # WithDecryption=True fails with AccessDenied without this.
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        ScheduleEvent:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
            State: ENABLED

  # The handler swallows send failures so the Lambda never errors, which is
  # how a revoked Gmail app password went unnoticed for two weeks. Count the
  # failure log line instead and alarm on that.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref RecipientEmail

  EmailFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScraperFunction}"
      FilterPattern: '"Failed to send email"'
      MetricTransformations:
        - MetricNamespace: HouseMe
          MetricName: EmailSendFailures
          MetricValue: "1"
          DefaultValue: 0

  # Sends fail at most once per run, so a broken mailer scores ~12/hour while
  # a one-off Gmail "server busy" scores 1 and clears on the next run.
  EmailFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: house-me email sends are failing (check the Gmail app password)
      Namespace: HouseMe
      MetricName: EmailSendFailures
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 6
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

Outputs:
  ScraperFunctionArn:
    Value: !GetAtt ScraperFunction.Arn
  DedupBucketName:
    Value: !Ref DedupBucket
